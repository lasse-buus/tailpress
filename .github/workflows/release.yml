name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package theme
        run: |
          set -euo pipefail
          rm -rf /tmp/tailpress-pkg tailpress.zip
          mkdir -p /tmp/tailpress-pkg/tailpress
          rsync -a \
            --exclude='.*' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='gulpfile.js' \
            --exclude='postcss.config.js' \
            --exclude='docs' \
            --exclude='tailpress.zip' \
            ./ /tmp/tailpress-pkg/tailpress/
          (cd /tmp/tailpress-pkg && zip -qr "$OLDPWD/tailpress.zip" tailpress)

      - name: Check zip
        run: |
          set -euo pipefail
          listing=$(unzip -l tailpress.zip)
          grep -q ' tailpress/style.css$' <<< "$listing"
          grep -q ' tailpress/functions.php$' <<< "$listing"
          grep -qE ' tailpress/dist/.+[^/]$' <<< "$listing"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" tailpress.zip --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false
